environment: dev
data:
  path: data/raw/credit_card_customers_v1.csv
  version: credit-card-v1
  target: High_Risk_Customer
training:
  random_seed: 42
  test_size: 0.25
  cv_folds: 3
  models:
    - name: logistic_regression
      params: {C: 1.0, max_iter: 1000}
    - name: random_forest
      params: {n_estimators: 75, max_depth: 6, min_samples_leaf: 3}
features:
  utilization_high_cutoff: 0.70
  late_payment_cutoff_days: 5
tracking:
  experiment_name: credit-risk-dev
  tracking_uri: file:./mlruns
quality_gate:
  metric: pr_auc
  minimum_baseline_delta: -0.01
  minimum_recall_at_precision: 0.45
